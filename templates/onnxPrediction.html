<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Prediction Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/onnxPrediction.css') }}">
    <script>
        console.log("JavaScript is loading...");
    </script>
    
</head>
<body>
    <div class="container">
        <h1>Extracted Text from Document</h1>

        <!-- Display Uploaded Image -->
        <h3>Uploaded Document:</h3>
        <img src="{{ url_for('uploaded_file', filename=image_filename) }}" alt="Uploaded Image" class="uploaded-image">

        

        <!-- Display Extracted Text Above Download Button -->
        <h2>Extracted Text:</h2>
            <ul>
                {% for line in extracted_text %}
                {% set parts = line.rsplit("(", 1) %}
                <li>
                    {{ parts[0] }}  
                    <span class="confidence">({{ parts[1] }}</span>
                 </li>
                {% endfor %}
            </ul>


        <!-- Download Button for Extracted Text -->
        <!--<a href="{{ url_for('download_text') }}" class="download-button">Download Extracted Text</a>-->
        
        <button type="button" onclick="downloadText()">Download Text</button>
        
        
        

        <!-- Feedback Section -->
        <div class="feedback-section">
            <h3>Was this prediction correct?</h3>
            <button class="small-button" onclick="submitFeedback(true)">Yes</button>
            <button class="small-button" onclick="showCorrectionInput()">No</button>
        
            <div id="correctionDiv" class="hidden">
                <input type="text" id="correctedText" placeholder="Enter correct text">
                <button class="submit-button" onclick="submitFeedback(false)">Submit</button>
            </div>
        </div>

        <!-- Try Again Button -->
        <a href="{{ url_for('home') }}">
            <button class="try-again-button">Try Another Image</button>
        </a>
    </div>

    <script>
        function showCorrectionInput() {
            document.getElementById("correctionDiv").classList.remove("hidden");
        }

        function submitFeedback(wasCorrect) {
            if (wasCorrect) {
                alert("Feedback submitted: Prediction was correct.");
            } else {
                let correctedText = document.getElementById("correctedText").value;
                if (correctedText.trim() === "") {
                    alert("Please enter the correct text.");
                    return;
                }
                alert("Feedback submitted: Correct text is '" + correctedText + "'.");
            }
        }
        function downloadText() {
            console.log("Download button clicked!"); // Debugging
            var text = `{{ clean_text | tojson | safe }}`; // ensures flask renders text safely
            if (!text.trim()) {
                alert("No text available to download");
                return;
            }
            var blob = new Blob([text], { type: "text/plain" });
            var link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "predicted_text.txt";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
    </script>
    
</body>
</html>
